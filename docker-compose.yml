services:
  db:
    image: postgres:16-alpine
    container_name: retention_ai_db
    environment:
      POSTGRES_USER: ${DATABASE_USER:-retention_user}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-retention_pass}
      POSTGRES_DB: ${DATABASE_NAME:-retention_ai}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-retention_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: retention_ai_api
    ports:
      - "8000:8000"
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME:-retention_ai}
      DATABASE_USER: ${DATABASE_USER:-retention_user}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-retention_pass}
      SECRET_KEY: ${SECRET_KEY:-changeme-in-production}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      MLFLOW_TRACKING_URI: http://mlflow:5000
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  retention_ai_frontend:
    container_name: retention_ai_frontend
    build:
      context: ../retention-ai-hr-assistant-frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    env_file:
      - ./.env
    environment:
      BACKEND_URL: http://api:8000
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: retention_ai_mlflow
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow
    environment:
      - MLFLOW_SERVER_HOST=0.0.0.0
      - MLFLOW_SERVER_PORT=5000
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:///mlflow/mlflow.db --default-artifact-root /mlflow/artifacts
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:5000/')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  mlflow_data:
